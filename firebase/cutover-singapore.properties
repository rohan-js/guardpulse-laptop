# Singapore RTDB cutover — STAGING ONLY, do not activate early
#
# The new instance `guardpulse-laptop-control-mumbai` (region asia-southeast1 —
# Mumbai is NOT an RTDB region; Singapore is the closest to India) does NOT exist
# yet. It can only be created after the Firebase project is upgraded to Blaze
# ("Blaze plan required for multiple database instances" from the v1beta API).
#
# When that is done, the cutover is:
#   1. firebase database:set / --instance <new>   (import US snapshot)
#   2. firebase deploy --only database --instance <new>  (same rules)
#   3. Replace the live US URL below with the new URL in:
#        firebase.local.properties (phone build)
#        windows/installer/installer.iss / install.ps1 / run-install.ps1 (defaults)
#        installed agent-config.json on BOTH laptops + service restart
#   4. Rebuild phone APK + installer, reinstall.
#
# Rollback: point everything back at the US URL. Old data stays intact.

newDatabaseUrl=https://guardpulse-laptop-control-mumbai.asia-southeast1.firebasedatabase.app
liveDatabaseUrl=https://guardpulse-laptop-control-default-rtdb.firebaseio.com
