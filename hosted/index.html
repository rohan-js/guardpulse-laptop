<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuardPulse Console — Anywhere</title>
<style>
  /* ===== GuardPulse design system (same as the laptop console; Stitch port) ===== */
  :root {
    --bg: #f7f9fb; --card: #ffffff; --low: #f2f4f6; --container: #eceef0;
    --high: #e6e8ea; --highest: #e0e3e5; --line: #c5c6cd; --line-strong: #75777d;
    --text: #191c1e; --primary: #091426; --muted: #45474c; --faint: #75777d;
    --accent: #0058be; --accent-hover: #2170e4; --accent-ring: rgba(0, 88, 190, .16);
    --brand: #1e293b; --danger: #ba1a1a; --danger-hover: #8c1414; --danger-ghost: #ffdad6;
    --ok-text: #047857; --ok-bg: #ecfdf5; --ok-border: #a7f3d0; --ok-dot: #10b981;
    --bad-text: #93000a; --bad-bg: #ffdad6; --bad-border: #f3b4b4;
    --warn-text: #92400e; --warn-bg: #fef3c7; --warn-border: #fde68a; --warn-dot: #f59e0b;
    --banner-bg: #1a2a3e; --banner-text: #d3e4fe; --banner-icon: #d8e2ff;
    --font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
    --shadow-sm: 0 1px 2px rgba(9, 20, 38, .06);
    --shadow-lg: 0 10px 15px -3px rgba(9, 20, 38, .12), 0 4px 6px -2px rgba(9, 20, 38, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: var(--mono); }
  .err { color: var(--danger); }
  .ok { color: var(--ok-text); }
  .spacer { flex: 1; }
  .center { text-align: center; padding: 72px 20px; color: var(--muted); }
  a.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  button { font: inherit; color: var(--text); background: var(--low); border: 1px solid var(--line);
           padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button:hover { background: var(--high); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.danger:hover { background: var(--danger-hover); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { background: var(--high); color: var(--primary); }
  button.ghost.danger { color: var(--danger); }
  button.ghost.danger:hover { background: var(--danger-ghost); color: var(--bad-text); }
  button.mini { padding: 5px 11px; font-size: 12.5px; border-radius: 6px; }
  button[disabled] { opacity: .45; pointer-events: none; }
  body.busy #app button, body.busy #deviceList button { opacity: .5; pointer-events: none; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon { flex: none; vertical-align: -3px; }
  input, select { font: inherit; color: var(--text); background: #fff; border: 1px solid var(--line);
                  border-radius: 8px; padding: 9px 12px; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); outline: none; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; padding: 0; }
  input[type="number"] { font-family: var(--mono); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 36px; height: 20px; border-radius: 999px; background: #d8dadc; position: relative; transition: background .15s; flex: none; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px;
                  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .knob { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .topbar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line);
            height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand b { font-size: 17px; font-weight: 800; color: var(--primary); letter-spacing: -.01em; }
  #hdrScope { color: var(--muted); font-size: 13px; }

  .logo-28 { width: 28px; height: 28px; border-radius: 6px; }
  .logo-36 { width: 36px; height: 36px; border-radius: 8px; }
  .logo-72 { width: 72px; height: 72px; border-radius: 16px; box-shadow: var(--shadow-sm); }
  .sidenav { display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: var(--low);
             border-right: 1px solid var(--line); padding: 18px 12px; flex-direction: column; gap: 4px; z-index: 6; }
  .sidenav-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
  .sidenav-brand b { display: block; font-size: 15px; font-weight: 700; color: var(--primary); }
  .sidenav-brand span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); }
  .sidenav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px;
                  background: transparent; border: none; color: var(--muted); font-weight: 600; font-size: 13.5px; text-align: left; }
  .sidenav-item:hover { background: var(--high); color: var(--primary); }
  body.scope-device .sidenav-item[data-nav="devices"] { background: var(--accent); color: #fff; }
  body.scope-device .sidenav-item[data-nav="devices"]:hover { background: var(--accent-hover); color: #fff; }
  .sidenav-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }
  .sidenav-foot .sidenav-item { display: flex; }
  @media (min-width: 1000px) {
    body.view-shell .sidenav { display: flex; }
    body.view-shell .shell { margin-left: 240px; }
  }
  .shell { min-height: 100vh; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px; width: 100%; }
  .page-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 20px; }
  .page-head h1, .display { font-size: 26px; font-weight: 800; color: var(--primary); margin: 0; letter-spacing: -.02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; align-items: center; gap: 9px; padding: 15px 20px; border-bottom: 1px solid var(--line);
               background: #fbfcfd; border-radius: 12px 12px 0 0; }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .card-head h2 .icon { color: var(--accent); }
  .card-body { padding: 20px; }
  .count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--high);
           color: var(--muted); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
          text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--highest); color: var(--muted); white-space: nowrap; }
  .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--line-strong); flex: none; }
  .pill.on { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .pill.on .dot { background: var(--ok-dot); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-text); border-color: var(--bad-border); }
  .pill.bad .dot { background: var(--danger); }
  .pill.off { background: var(--highest); color: var(--muted); }
  .pill.off .dot { background: var(--line-strong); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .pill.warn .dot { background: var(--warn-dot); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px;
          padding: 3px 8px; border-radius: 4px; background: var(--high); border: 1px solid var(--line);
          color: var(--primary); white-space: nowrap; }
  .chip.bad { background: #fff5f5; border-color: var(--bad-border); color: var(--danger); }
  .banner { display: flex; align-items: center; gap: 10px; background: var(--banner-bg); color: var(--banner-text);
            border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-sm); }
  .banner .icon { color: var(--banner-icon); }
  .banner .spin { animation: rot 1s linear infinite; }
  .banner.delayed { background: var(--danger-ghost); color: var(--bad-text); }
  .banner.delayed .icon { color: var(--danger); }
  @keyframes rot { to { transform: rotate(360deg); } }
  .spin { animation: rot 1s linear infinite; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
             border-radius: 999px; animation: rot 1s linear infinite; margin: 0 auto 14px; }
  .console-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; align-items: start; }
  .console-grid > section { min-width: 0; }
  .cg-rail { grid-column: span 3; display: flex; flex-direction: column; gap: 20px; }
  .cg-apps { grid-column: span 9; }
  .cg-modes { grid-column: span 4; display: flex; flex-direction: column; }
  .cg-modes .card { height: 100%; }
  .cg-modes.span-full { grid-column: 1 / -1; }
  .cg-rules { grid-column: span 8; }
  .cg-events { grid-column: span 12; }
  @media (max-width: 1080px) {
    .cg-rail, .cg-apps, .cg-modes, .cg-rules, .cg-events { grid-column: span 12; }
  }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0;
                border-bottom: 1px dashed var(--highest); font-size: 13.5px; }
  .status-row:last-child { border-bottom: none; }
  .status-row .label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .status-row .value { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 500; }
  details.tablist summary { cursor: pointer; margin: 6px 0; }
  .tablist .tab { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .reqrow { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; margin-bottom: 10px; }
  .reqrow:last-child { margin-bottom: 0; }
  .reqrow.critical { border-color: var(--bad-border); background: #fff7f7; }
  .req-top { display: flex; align-items: center; gap: 10px; }
  .req-title { font-weight: 600; color: var(--primary); }
  .req-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #fff;
           font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .card-tools { display: flex; align-items: center; gap: 10px; padding: 14px 20px 0; }
  .search-wrap { position: relative; flex: 1; max-width: 300px; }
  .search-wrap .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search-wrap input { width: 100%; padding-left: 34px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px;
       border-bottom: 1px solid var(--line); background: #fbfcfd; white-space: nowrap; }
  th.right, td.right { text-align: right; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--highest); vertical-align: middle; font-size: 13.5px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--bg); }
  tbody tr.rowbad { background: #fff7f7; }
  tbody tr.rowbad:hover { background: #ffeeee; }
  .app-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--primary); }
  .app-tile { width: 30px; height: 30px; border-radius: 6px; background: #f1f5f9; border: 1px solid var(--line);
              display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
              color: var(--brand); flex: none; }
  td .row { gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
  .cell-row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; justify-content: flex-start; }
  #appTable select { padding: 5px 6px; font-size: 12.5px; border-radius: 6px; }
  #appTable td .app-cell span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .modes-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .modebox { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; }
  .modebox.active { border: 2px solid var(--accent); background: rgba(0, 88, 190, .04); }
  .modehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .modehead b { color: var(--primary); font-size: 15px; }
  .modebody { margin-top: 12px; border-top: 1px dashed var(--highest); padding-top: 12px; }
  .rules-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .rule-sec { padding: 18px 20px; border-top: 1px solid var(--highest); min-width: 0; }
  .rule-sec:nth-child(odd) { border-right: 1px solid var(--highest); }
  .rule-sec:first-child, .rule-sec:nth-child(2) { border-top: none; }
  .rule-sec.span2 { grid-column: 1 / -1; }
  .sec-title { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
               color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .sec-title .icon { color: var(--accent); }
  @media (max-width: 760px) {
    .rules-grid { grid-template-columns: 1fr; }
    .rule-sec:nth-child(odd) { border-right: none; }
    .rule-sec:nth-child(2) { border-top: 1px solid var(--highest); }
  }
  .dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

<!-- Firebase project config: the API key is NOT committed to the repo.
     On the deploy machine it lives in the gitignored firebase-config.js
     (see firebase-config.example.js); a missing file falls back to the
     placeholder below, which makes sign-in fail loudly. The key is a
     client-side identifier — Firebase security comes from Security Rules,
     not from hiding the key. -->
<script src="firebase-config.js"></script>
<script>
"use strict";
/* =====================================================================
   GuardPulse Hosted Console — talks to Firebase DIRECTLY from the browser
   (no laptop / agent required). Owner console only, phone-parity behavior.
   Protocol ported from RtdbFirebaseClient.cs / SyncEngine / AgentHostedService.
   ===================================================================== */

// ------------------------------------------------------------------ config
const GP_FIREBASE = window.GP_FIREBASE || {};
const FB = {
  apiKey: GP_FIREBASE.apiKey || "REPLACE_WITH_YOUR_FIREBASE_API_KEY",
  projectId: GP_FIREBASE.projectId || "guardpulse-laptop-control",
  databaseUrl: GP_FIREBASE.databaseUrl || "https://guardpulse-laptop-control-default-rtdb.firebaseio.com",
};
const AUTH_URL = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + FB.apiKey;
const TOKEN_URL = "https://securetoken.googleapis.com/v1/token?key=" + FB.apiKey;

// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function guid(){ return (crypto.randomUUID && crypto.randomUUID()) || "xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }); }
function b64urlBytes(bytes){ let s = ""; for (let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64urlEncode(str){ return b64urlBytes(new TextEncoder().encode(str)); }
// Decodes a base64url key (domainsToday keys are b64url: RTDB keys cannot contain '.');
// returns the raw input when it does not decode to readable text.
function b64urlDecode(s){
  try{
    const b = atob(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
    const out = decodeURIComponent(escape(b));
    return /[\u0000-\u001f]/.test(out) ? s : out;
  }catch(e){ return s; }
}
function clone(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

// ------------------------------------------------------------------ auth
const auth = {
  uid: null, idToken: null, expiresAt: 0, refreshToken: null,
  get fresh(){ return !!this.idToken && Date.now() < this.expiresAt - 60_000; },
  invalidate(){ this.idToken = null; this.expiresAt = 0; },
  async ensure(){
    if (this.fresh) return this.idToken;
    if (this.refreshToken){
      try { await this.doRefresh(); return this.idToken; } catch (e) { /* fall through */ }
    }
    throw new Error("Not signed in.");
  },
  async doRefresh(){
    const res = await fetch(TOKEN_URL, { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(this.refreshToken) + "&returnSecureToken=true" });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.id_token) throw new Error((j.error && j.error.message) || "Token refresh failed");
    this.idToken = j.id_token; this.refreshToken = j.refresh_token; this.uid = j.user_id;
    this.expiresAt = Date.now() + (parseFloat(j.expires_in) || 3600) * 1000;
    try { localStorage.setItem("gp.refresh", this.refreshToken); } catch (e) { /* private mode */ }
  },
  async signIn(email, password){
    const res = await fetch(AUTH_URL, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, returnSecureToken: true }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.idToken) throw new Error((j.error && j.error.message) || "Sign-in failed");
    this.uid = j.localId; this.idToken = j.idToken; this.refreshToken = j.refreshToken;
    this.expiresAt = Date.now() + (parseFloat(j.expiresIn) || 3600) * 1000;
    try { localStorage.setItem("gp.refresh", this.refreshToken); } catch (e) { /* ignore */ }
    return this.uid;
  },
  signOut(){ this.uid = null; this.idToken = null; this.refreshToken = null; try { localStorage.removeItem("gp.refresh"); } catch (e) { /* ignore */ } },
};

// ------------------------------------------------------------------ REST transport (RtdbFirebaseClient port)
const DB = FB.databaseUrl;
function dbUrl(path, token){
  const segs = String(path || "").split("/").filter(Boolean).map(encodeURIComponent).join("/");
  const base = segs ? DB + "/" + segs : DB;
  return base + ".json?auth=" + encodeURIComponent(token);
}
async function dbRequest(method, path, json, _retried){
  const tok = await auth.ensure();
  // Hard timeout: a stalled request must never hang the UI. Browsers cap concurrent
  // connections per host (~6), so long-lived SSE streams plus parallel GETs can
  // deadlock; a timeout converts any stall into a visible error instead.
  const dbg = window.__dbg = window.__dbg || { reqs: [] };
  const rec = { m: method, p: path, t0: Date.now() };
  dbg.reqs.push(rec);
  if (dbg.reqs.length > 60) dbg.reqs.splice(0, dbg.reqs.length - 60);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  let res;
  try {
    // Unique query param per request: some filtering proxies cache by path and
    // ignore Cache-Control, which would serve STALE rules and show lock states
    // that no longer exist. A per-request nonce forces every hop to miss.
    res = await fetch(dbUrl(path, tok) + "&cb=" + (++dbReqSeq), {
      method,
      headers: json != null ? { "Content-Type": "application/json" } : {},
      body: json != null ? json : undefined,
      signal: ctl.signal,
      cache: "no-store",
    });
  } catch (e){
    rec.err = (e && e.name === "AbortError") ? "timeout" : (e.message || "network error");
    throw new Error(rec.err === "timeout" ? "Request timed out (25s): " + method + " " + path : (e.message || "network error"));
  } finally {
    rec.ms = Date.now() - rec.t0;
    clearTimeout(timer);
  }
  if (res.status === 401 && !_retried){
    auth.invalidate();
    return dbRequest(method, path, json, true);
  }
  if (!res.ok){
    const t = await res.text().catch(() => "");
    throw new Error("HTTP " + res.status + (t ? ": " + t.slice(0, 140) : ""));
  }
  return await res.text(); // raw JSON; "null" when the node is missing
}
const dbGet  = (p) => dbRequest("GET", p, null);
const dbPut  = (p, j) => dbRequest("PUT", p, j);
const dbPatch = (p, j) => dbRequest("PATCH", p, j);

// ------------------------------------------------------------------ server time
let serverOffsetMs = 0;
// The raw-REST .info/serverTimeOffset endpoint can stall in browsers (fetches to
// Firebase's realtime path behave differently than the regular data paths). Use a
// short timeout and never block the UI on this call.
async function refreshServerOffset(){
  try {
    const tok = await auth.ensure();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    try {
      const res = await fetch(dbUrl(".info/serverTimeOffset", tok), { signal: ctl.signal });
      if (res.ok){ const raw = await res.text(); const n = parseFloat(raw); serverOffsetMs = isFinite(n) ? n : 0; }
    } catch (e) { /* keep cached offset (0) */ }
    finally { clearTimeout(timer); }
  } catch (e) { /* ignore */ }
}
const serverNow = () => Date.now() + serverOffsetMs;

// ------------------------------------------------------------------ policy constants (PolicyConstants port)
const POLICY = {
  SYNC_PROTOCOL_VERSION: 2,
  MAX_DAILY_LIMIT_MINUTES: 1440,
  WINDOWS_TASK_MANAGER: "guardpulse.windows.taskmgr",
  WINDOWS_COMMAND_LINE: "guardpulse.windows.commandline",
  WINDOWS_REGISTRY_EDITOR: "guardpulse.windows.registry",
  WINDOWS_SETTINGS: "guardpulse.windows.settings",
  WINDOWS_INSTALLERS: "guardpulse.windows.installers",
  COMMAND_RESCAN_APPS: "rescanApps", COMMAND_RESET_TODAY: "resetToday",
  COMMAND_UNPAIR: "unpair", COMMAND_OPEN_SETUP: "openSetup",
  UNLOCK_PENDING: "pending", UNLOCK_APPROVED: "approved", UNLOCK_DENIED: "denied", UNLOCK_EXPIRED: "expired",
  UNLOCK_APPROVAL_ONE_VISIT: "oneVisit", UNLOCK_APPROVAL_TIMED: "timed",
  SYNC_STATUS_APPLIED: "applied", SYNC_STATUS_FAILED: "failed",
  UNLOCK_15: 900000, UNLOCK_30: 1800000,
};
POLICY.settingsSections = [
  { pkg: "com.guardpulse.policy.settings_apps", label: "Settings: Apps" },
  { pkg: "com.guardpulse.policy.settings_developer_options", label: "Settings: Developer options" },
  { pkg: "com.guardpulse.policy.settings_security_restrictions", label: "Settings: Security & restrictions" },
  { pkg: "com.guardpulse.policy.settings_accessibility", label: "Settings: Accessibility" },
  { pkg: "com.guardpulse.policy.settings_reset", label: "Settings: Reset" },
];
POLICY.windowsBypass = [
  POLICY.WINDOWS_TASK_MANAGER, POLICY.WINDOWS_COMMAND_LINE, POLICY.WINDOWS_REGISTRY_EDITOR,
  POLICY.WINDOWS_SETTINGS, POLICY.WINDOWS_INSTALLERS,
];
POLICY.settingsSectionLock = POLICY.settingsSections.map(s => s.pkg);
POLICY.defaultLocked = POLICY.settingsSectionLock.concat(POLICY.windowsBypass);
const BYPASS_LABELS = {
  [POLICY.WINDOWS_TASK_MANAGER]: "Task Manager",
  [POLICY.WINDOWS_COMMAND_LINE]: "Command Prompt & PowerShell",
  [POLICY.WINDOWS_REGISTRY_EDITOR]: "Registry Editor",
  [POLICY.WINDOWS_SETTINGS]: "Windows Settings",
  [POLICY.WINDOWS_INSTALLERS]: "Installers",
};
function labelFor(appKey){
  if (BYPASS_LABELS[appKey]) return BYPASS_LABELS[appKey];
  const sec = POLICY.settingsSections.find(s => s.pkg === appKey);
  if (sec) return sec.label;
  const i = appKey.lastIndexOf("/");
  return i >= 0 ? appKey.slice(i + 1) : appKey;
}
function commandTtl(type){
  if (type === POLICY.COMMAND_OPEN_SETUP) return 60000;
  if (type === POLICY.COMMAND_UNPAIR) return 600000;
  return 300000;
}

// ------------------------------------------------------------------ control parser (ControlProtocol port)
function str(v){ return (typeof v === "string" && v) ? v : (v != null ? String(v) : null); }
function num(v){ if (v == null) return null; if (typeof v === "number") return v; if (typeof v === "string" && v.trim() !== "" && isFinite(+v)) return +v; return null; }
function bool(v){ if (v === true || v === 1) return true; if (v === false || v === 0) return false; if (typeof v === "string"){ if (v === "true" || v === "1") return true; if (v === "false" || v === "0") return false; } return null; }
function parseApps(el){
  const out = {};
  if (!el || typeof el !== "object" || Array.isArray(el)) return out;
  for (const [encodedKey, a] of Object.entries(el)){
    if (!a || typeof a !== "object") continue;
    const pkg = str(a.packageName); if (!pkg) throw new Error("App package is missing");
    if (b64urlEncode(pkg) !== encodedKey) throw new Error("App policy key does not match package");
    const pkgKey = str(a.packageKey); if (pkgKey && pkgKey !== encodedKey) throw new Error("App package key does not match policy key");
    const manualBlocked = bool(a.manualBlocked); if (manualBlocked == null) throw new Error("App manualBlocked flag is missing");
    let dailyLimitMinutes = null;
    if (a.dailyLimitMinutes != null){
      const raw = num(a.dailyLimitMinutes);
      if (raw == null) throw new Error("App daily limit is invalid");
      if (raw < 1 || raw > POLICY.MAX_DAILY_LIMIT_MINUTES) throw new Error("App daily limit is out of range");
      dailyLimitMinutes = raw;
    }
    out[pkg] = { packageName: pkg, manualBlocked, dailyLimitMinutes, updatedAt: num(a.updatedAt) };
  }
  return out;
}
function parseControl(raw){
  if (!raw || raw.trim() === "" || raw.trim() === "null") return { status: "missing", snapshot: null, error: null };
  let root;
  try { root = JSON.parse(raw); } catch (e){ return { status: "invalid", snapshot: null, error: "Control payload is not valid JSON: " + e.message }; }
  if (!root || typeof root !== "object" || Array.isArray(root)) return { status: "invalid", snapshot: null, error: "Control snapshot is not an object" };
  if (num(root.schemaVersion) !== POLICY.SYNC_PROTOCOL_VERSION) return { status: "invalid", snapshot: null, error: "Unsupported control schema: " + (num(root.schemaVersion) ?? "missing") };
  const revisionId = str(root.revisionId);
  if (!revisionId) return { status: "invalid", snapshot: null, error: "Control revision is missing" };
  try {
    const apps = parseApps(root.apps);
    const modes = {};
    const modesEl = root.modes;
    if (modesEl && typeof modesEl === "object" && !Array.isArray(modesEl)){
      for (const [encodedId, m] of Object.entries(modesEl)){
        if (!m || typeof m !== "object") continue;
        const modeId = str(m.modeId) ?? encodedId;
        if (!modeId || modeId !== encodedId) continue;
        const name = (str(m.name) || "").trim();
        if (!name) continue;
        modes[modeId] = { modeId, name, apps: parseApps(m.apps), createdAt: num(m.createdAt), updatedAt: num(m.updatedAt) };
      }
    }
    let activeMode = null;
    if (root.activeMode && typeof root.activeMode === "object"){
      const modeId = str(root.activeMode.modeId);
      if (modeId && modes[modeId]) activeMode = { modeId, modeName: str(root.activeMode.modeName), activatedAt: num(root.activeMode.activatedAt) };
    }
    let safeMode = { enabled: false, until: 0, startedAt: null, startedBy: null };
    if (root.safeMode && typeof root.safeMode === "object"){
      const enabled = bool(root.safeMode.enabled);
      const until = num(root.safeMode.until);
      if (enabled != null && until != null){
        const c = { enabled, until, startedAt: num(root.safeMode.startedAt), startedBy: str(root.safeMode.startedBy) };
        if (!(c.enabled && c.until <= 0)) safeMode = c;
      }
    }
    let pin = null;
    if (root.pin && typeof root.pin === "object"){
      const salt = str(root.pin.salt), hash = str(root.pin.hash);
      const version = num(root.pin.version) ?? 1;
      const algorithm = str(root.pin.algorithm);
      const iterations = num(root.pin.iterations);
      if (salt && hash && (version === 1 || version === 2)
        && (version !== 2 || (algorithm === "PBKDF2WithHmacSHA256" && iterations != null && iterations >= 210000 && iterations <= 1000000)))
        pin = { salt, hash, version, algorithm, iterations, updatedAt: num(root.pin.updatedAt) };
    }
    let schedule = null;
    if (root.schedule){
      const en = bool(root.schedule.enabled), st = num(root.schedule.startMinute), en2 = num(root.schedule.endMinute);
      if (en == null || st == null || en2 == null) throw new Error("Schedule window is missing");
      if (st < 0 || st > 1439 || en2 < 0 || en2 > 1439) throw new Error("Schedule window is out of range");
      schedule = { enabled: en, startMinute: st, endMinute: en2 };
    }
    let budget = null;
    if (root.budget){
      const m = num(root.budget.dailyLimitMinutes);
      if (m == null) throw new Error("Budget limit is missing");
      if (m < 1 || m > 1440) throw new Error("Budget limit is out of range");
      budget = { dailyLimitMinutes: m };
    }
    let contentFilter = null;
    if (root.contentFilter){
      contentFilter = {
        social: bool(root.contentFilter.social) === true, gambling: bool(root.contentFilter.gambling) === true,
        adult: bool(root.contentFilter.adult) === true, gaming: bool(root.contentFilter.gaming) === true,
      };
    }
    let allowlist = null;
    if (root.allowlist){
      const en = bool(root.allowlist.enabled);
      if (en == null) throw new Error("Allowlist enabled flag is missing");
      allowlist = { enabled: en };
    }
    let customDomains = null;
    if (Array.isArray(root.customBlockedDomains)){
      const seen = new Set();
      customDomains = [];
      for (const d of root.customBlockedDomains){
        if (typeof d !== "string") continue;
        const t = d.trim(); if (!t) continue;
        if (!seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); customDomains.push(t); }
        if (customDomains.length >= 100) break;
      }
      if (!customDomains.length) customDomains = null;
    }
    return { status: "valid", snapshot: {
      revisionId, updatedAt: num(root.updatedAt), updatedBy: str(root.updatedBy),
      apps, modes, activeMode, safeMode, pin, schedule, budget, contentFilter, allowlist, customDomains,
    }, error: null };
  } catch (e){
    return { status: "invalid", snapshot: null, error: e.message };
  }
}
function effectiveApps(snapshot){
  let base = {};
  if (snapshot.activeMode && snapshot.modes[snapshot.activeMode.modeId]){
    base = Object.assign({}, snapshot.modes[snapshot.activeMode.modeId].apps);
  } else {
    base = Object.assign({}, snapshot.apps);
  }
  for (const p of POLICY.defaultLocked){
    if (!(p in base)) base[p] = { packageName: p, manualBlocked: true, dailyLimitMinutes: null };
  }
  return base;
}

// ------------------------------------------------------------------ per-device cache + state composer
const devCache = {}; // deviceId -> { control, inventory, stateApps, browser, syncApplied, unlocks, tamper, userDevice }
const POLL_INTERVAL = 8000;

async function readNodeCached(deviceId, key, path){
  if (!devCache[deviceId]) devCache[deviceId] = {};
  const raw = await dbGet(path);
  devCache[deviceId][key] = (raw && raw.trim() === "null") ? null : JSON.parse(raw);
  return devCache[deviceId][key];
}
async function getRaw(deviceId, key, path, cache){
  if (cache[key] !== undefined) return cache[key];
  const raw = await dbGet(path);
  cache[key] = (raw && raw.trim() === "null") ? null : JSON.parse(raw);
  return cache[key];
}
function parseAppsState(stateApps, labelByPkg){
  const list = [];
  if (!stateApps) return list;
  for (const [key, v] of Object.entries(stateApps)){
    if (!v || typeof v !== "object") continue;
    let ms = num(v.usageMs);
    if (ms == null) ms = (num(v.minutes) || 0) * 60000;
    const pkg = str(v.packageName) || (() => { try { return decodeKey(key); } catch (e){ return key; } })();
    // Keep every entry the TV reported (even zero-usage): lockBlocked is the TV's
    // ACTUAL enforcement state, and the phone shows it instead of the desired rule.
    list.push({
      key, label: (labelByPkg && labelByPkg[pkg]) || labelFor(pkg), minutes: Math.floor(ms / 60000), ms,

}
function decodeKey(key){
  let unpadded = key.replace(/-/g, "+").replace(/_/g, "/");
  while (unpadded.length % 4) unpadded += "=";
  return new TextDecoder().decode(Uint8Array.from(atob(unpadded), c => c.charCodeAt(0)));
}
function parsePendingUnlocks(unlocks, labelByPkg){
  const out = [];
  if (!unlocks) return out;
  const now = serverNow();
  for (const [requestId, r] of Object.entries(unlocks)){
    if (!r || typeof r !== "object") continue;
    if (r.status !== POLICY.UNLOCK_PENDING) continue;
    const expiresAt = num(r.expiresAt);
    if (expiresAt != null && expiresAt <= now) continue;
    const pkg = str(r.packageName) || "";
    out.push({ requestId, packageName: pkg, label: (labelByPkg && labelByPkg[pkg]) || labelFor(pkg), reason: str(r.reason), createdAt: num(r.createdAt), expiresAt });
  }
  return out.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 50);
}
function parseTamperEvents(tamper){
  const out = [];
  if (!tamper) return out;
  for (const [id, e] of Object.entries(tamper)){
    if (!e || typeof e !== "object") continue;
    out.push({ type: str(e.type) || "event", message: str(e.message), createdAt: num(e.createdAt) });
  }
  return out.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 50);
}
// inventory -> [{key,packageName,label,blockable,protectedReason}]
function parseInventory(appsNode){
  const list = [];
  if (!appsNode) return list;
  for (const [key, v] of Object.entries(appsNode)){
    if (!v || typeof v !== "object") continue;
    let pkg = str(v.packageName);
    if (!pkg){ try { pkg = decodeKey(key); } catch (e){ pkg = key; } }
    list.push({
      key, packageName: pkg,
      label: str(v.label) || labelFor(pkg),
      blockable: v.blockable === undefined ? null : !!v.blockable,
      protectedReason: str(v.protectedReason),
    });
  }

}
function buildAppsList(snapshot, inventory){
  const merged = {}; // key -> row
  for (const inv of inventory || []){

  }
  if (snapshot){
    for (const [pkg, rule] of Object.entries(effectiveApps(snapshot))){
      const key = b64urlEncode(pkg);
      const existing = merged[key];
      merged[key] = {
        key, packageName: pkg,
        label: existing && existing.label ? existing.label : labelFor(pkg),
        blockable: existing ? existing.blockable : null,
        protectedReason: existing ? existing.protectedReason : null,
        blocked: !!rule.manualBlocked, dailyLimitMinutes: rule.dailyLimitMinutes,
      };
    }
  }
  return Object.values(merged).sort((a, b) => String(a.label).localeCompare(b.label, undefined, { sensitivity: "base" }));
}
function buildModesList(snapshot){
  const out = [];

  for (const [modeId, m] of Object.entries(snapshot.modes || {})){
    const apps = [];
    for (const [pkg, rule] of Object.entries(m.apps || {})){
      apps.push({ key: b64urlEncode(pkg), packageName: pkg, label: labelFor(pkg), blocked: !!rule.manualBlocked, dailyLimitMinutes: rule.dailyLimitMinutes });
    }
    out.push({ modeId, name: m.name, createdAt: m.createdAt, updatedAt: m.updatedAt, appCount: apps.length, apps });

}
// Composes the exact state DTO the console UI consumes.

// ------------------------------------------------------------------ control writes (WriteControlV2WithRetryAsync port)
function mergeInto(target, patch){
  for (const [k, v] of Object.entries(patch || {})){
    if (v === null){ delete target[k]; continue; }
    if (v && typeof v === "object" && !Array.isArray(v)
      && target[k] && typeof target[k] === "object" && !Array.isArray(target[k])){
      mergeInto(target[k], v);
    } else {
      target[k] = clone(v);
    }
  }
}
function findDropped(root, snapshot){
  if (root.modes && typeof root.modes === "object"){
    for (const [modeId, m] of Object.entries(root.modes)){
      if (m && typeof m === "object" && !snapshot.modes[modeId]) return "Mode '" + modeId + "' was rejected: it needs a non-empty name and its id must match its key.";
    }
  }
  if (root.activeMode && typeof root.activeMode === "object" && root.activeMode.modeId){
    const wanted = str(root.activeMode.modeId);
    // The parser drops an activeMode pointing at an unknown mode entirely; that must
    // still be reported (matches the C# writer), not silently written away.
    if (wanted && (!snapshot.activeMode || snapshot.activeMode.modeId !== wanted))
      return "Cannot activate mode '" + wanted + "': no mode with that id exists.";
  }
  return null;
}
function extractRevisionId(raw){
  try { return str(JSON.parse(raw).revisionId); } catch (e){ return null; }
}
async function writeControl(deviceId, patch){
  for (let attempt = 0; attempt < 3; attempt++){
    const cache = devCache[deviceId] || (devCache[deviceId] = {});
    let currentRaw = cache.control;
    // The cache may hold either the raw REST string (fresh read) or a parsed object
    // (stream update / previous write); normalize to string for JSON.parse below.
    if (currentRaw !== undefined && currentRaw !== null && typeof currentRaw !== "string") currentRaw = JSON.stringify(currentRaw);
    if (attempt > 0 || currentRaw === undefined){
      currentRaw = await dbGet("devices/" + deviceId + "/control/v2");
    }
    let root = {};
    if (currentRaw && currentRaw.trim() !== "null"){
      try { root = JSON.parse(currentRaw); } catch (e){ root = {}; }
      if (!root || typeof root !== "object" || Array.isArray(root)) root = {};
    }
    mergeInto(root, patch);
    const revisionId = guid();
    root.schemaVersion = POLICY.SYNC_PROTOCOL_VERSION;
    root.revisionId = revisionId;
    root.updatedAt = { ".sv": "timestamp" };
    root.updatedBy = auth.uid;
    if (!root.safeMode || typeof root.safeMode !== "object" || !("enabled" in root.safeMode) || !("until" in root.safeMode)){
      root.safeMode = { enabled: false, until: 0 };
    }
    const json = JSON.stringify(root);
    const parsed = parseControl(json);
    if (parsed.status !== "valid" || !parsed.snapshot) return { ok: false, error: parsed.error || "Invalid merged control snapshot (rejected by parser)" };
    const dropped = findDropped(root, parsed.snapshot);
    if (dropped) return { ok: false, error: dropped };
    let stored;
    try {
      await dbPut("devices/" + deviceId + "/control/v2", json);
      stored = await dbGet("devices/" + deviceId + "/control/v2");
    } catch (e){
      return { ok: false, error: e.message };
    }
    cache.control = (stored && stored.trim() === "null") ? null : (() => { try { return JSON.parse(stored); } catch (e){ return null; } })();
    if (stored && extractRevisionId(stored) === revisionId) return { ok: true, error: null, revisionId };
  }
  return { ok: false, error: "Control write conflicted with another writer. Refresh and try again." };
}

// ------------------------------------------------------------------ owner actions
async function sendCommand(deviceId, type, packageName){
  const commandId = guid();
  const payload = { type, requestedBy: auth.uid, createdAt: { ".sv": "timestamp" }, ttlMs: commandTtl(type), status: "pending" };
  if (packageName) payload.packageName = packageName;
  await dbPut("devices/" + deviceId + "/commands/" + commandId, JSON.stringify(payload));
}
async function respondUnlock(deviceId, requestId, action){
  const raw = await dbGet("devices/" + deviceId + "/unlockRequests/" + requestId);
  if (!raw || raw.trim() === "null") throw new Error("Unlock request not found (it may have expired and been cleaned up).");
  const req = JSON.parse(raw);
  if (req.status !== POLICY.UNLOCK_PENDING) throw new Error("This request is no longer pending (status: " + (req.status || "unknown") + ").");
  const patch = { status: POLICY.UNLOCK_APPROVED, updatedAt: { ".sv": "timestamp" }, updatedBy: auth.uid };
  if (action === "approveOneVisit"){ patch.approvalType = POLICY.UNLOCK_APPROVAL_ONE_VISIT; }
  else if (action === "approve15"){ patch.approvalType = POLICY.UNLOCK_APPROVAL_TIMED; patch.approvalDurationMs = POLICY.UNLOCK_15; }
  else if (action === "approve30"){ patch.approvalType = POLICY.UNLOCK_APPROVAL_TIMED; patch.approvalDurationMs = POLICY.UNLOCK_30; }
  else if (action === "deny"){ patch.status = POLICY.UNLOCK_DENIED; delete patch.approvalType; }
  else throw new Error("Unknown action.");
  await dbPatch("devices/" + deviceId + "/unlockRequests/" + requestId, JSON.stringify(patch));
}
async function derivePinHash(pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const ikm = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" }, ikm, 256);
  return { salt: b64urlBytes(salt), hash: b64urlBytes(new Uint8Array(bits)) };
}
async function setPin(deviceId, pin){
  const created = await derivePinHash(pin);
  const pinNode = { salt: created.salt, hash: created.hash, version: 2, algorithm: "PBKDF2WithHmacSHA256", iterations: 600000, updatedAt: { ".sv": "timestamp" }, updatedBy: auth.uid };
  const w = await writeControl(deviceId, { pin: pinNode });
  if (!w.ok) return w;
  try { await dbPatch("devices/" + deviceId + "/security/pin", JSON.stringify(pinNode)); } catch (e){ /* non-fatal mirror */ }
  return w;
}

function fmtMs(ms){
  if (!ms || ms < 1000) return "0s";
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const parts = [];
  if (h) parts.push(h + "h");
  if (m) parts.push(m + "m");
  if (s) parts.push(s + "s");
  return parts.join(" ") || "0s";
}
function fmtAge(ts){

  if (d < 60000) return "just now";
  const m = Math.floor(d / 60000);
  if (m < 60) return m + " min ago";
  return Math.floor(m / 60) + "h " + (m % 60) + "m ago";
}

}

  if (!STATE) return "";

function editingBlocked(){
  const el = document.activeElement;
  return !!el && $("app").contains(el) && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA");
}
function maybeRender(){
  if (!STATE) return;
  const key = stateKey();
  if (key === lastRenderKey) return;
  if (editingBlocked()){
    if (!renderDeferred){
      renderDeferred = true;
      const check = () => {
        if (!SCOPE){ renderDeferred = false; return; }
        if (editingBlocked()){ setTimeout(check, 500); return; }
        renderDeferred = false;
        if (stateKey() !== lastRenderKey) render();
      };
      setTimeout(check, 800);
    }
    return;
  }
  render();
}
function noteWritten(revisionId){

  if (!pendingRevision || !SCOPE || SCOPE.kind !== "device") return "idle";
  if (pendingRevision === "__timeout__") return "delayed";
  if (STATE && STATE.syncStatus === "applied" && STATE.syncRevisionId === pendingRevision){ pendingRevision = null; return "idle"; }
  return "waiting";
}

// ----------------------------------------------------------- live wiring (polling)
// Live updates use POLLING, not SSE streams: Chrome caps concurrent connections per
// host (~6), and 7 long-lived streams + the state GETs deadlocked the page ("Loading
// device…" forever). Polling refreshes every POLL_INTERVAL ms instead.
function startDeviceStreams(deviceId){
  stopAllDeviceStreams();
  const poll = () => { if (SCOPE && SCOPE.deviceId === deviceId && !document.hidden) refreshState(true); };
  POLLERS[deviceId] = setInterval(poll, POLL_INTERVAL);
  STREAMS[deviceId] = [];
}
function stopAllDeviceStreams(){
  for (const [id, stops] of Object.entries(STREAMS)){ stops.forEach(s => { try { s(); } catch (e) { /* ignore */ } }); }
  for (const id of Object.keys(POLLERS)){ clearInterval(POLLERS[id]); delete POLLERS[id]; }
  for (const id of Object.keys(STREAMS)) delete STREAMS[id];
}
let lastStateRefresh = 0, pollFailures = 0, dbReqSeq = 0;
function fmtAge(ms){
  const s = Math.floor(ms / 1000);
  if (s < 8) return "just now";
  if (s < 90) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  return Math.floor(m / 60) + "h " + (m % 60) + "m ago";
}
// The header age must reflect REAL time, not just the last successful poll — a
// frozen "updated just now" would hide exactly the stale-data case we care about.
function updateFreshHeader(){
  if (!SCOPE || SCOPE.kind !== "device" || !STATE) return;
  const base = "Controlling: " + (STATE.label || SCOPE.deviceId) + (STATE.online ? " · online" : " · offline");
  if (!lastStateRefresh){ setHeader(base); return; }
  const age = Date.now() - lastStateRefresh;
  setHeader(base + " · updated " + fmtAge(age) + (age > 120000 ? " ⚠" : ""));
}
setInterval(updateFreshHeader, 5000);
async function refreshState(silent){
  if (!SCOPE) return;
  try {
    // Fresh read every poll: clear the cache so compose re-fetches from Firebase
    // (otherwise the cached values would go stale forever).
    const cache = devCache[SCOPE.deviceId] || (devCache[SCOPE.deviceId] = {});
    Object.keys(cache).forEach(k => delete cache[k]);
    const st = await composeDeviceState(SCOPE.deviceId);
    applyState(st);
    lastStateRefresh = Date.now();
    pollFailures = 0;
    updateFreshHeader();
  } catch (e){
    // Silent for the single-poll case, but repeated failures must be VISIBLE —
    // a tab silently stuck on old data looks exactly like a wrong lock state.
    pollFailures++;
    if (pollFailures === 3) toast("Live updates are failing — the data shown may be stale. Retrying…");
    if (!silent) toast("Refresh failed: " + (e.message || ""));
  }
}

// ----------------------------------------------------------- sign-in / device list
function renderDeviceList(){
  const grid = $("devGrid"); grid.innerHTML = "";
  $("devCount").textContent = DEVICES.length ? "· " + DEVICES.length + " paired" : "";
  if (!DEVICES.length){
    $("devEmpty").innerHTML = '<div class="empty-dash"><b>No devices found under this account yet.</b><br/>Pair a device from the phone app and it will appear here.</div>';
    return;
  }
  $("devEmpty").textContent = "";
  DEVICES.forEach(d => {
    const el = document.createElement("div");
    el.className = "dev";
    const online = !!d.online;
    const health = d.protectionHealthy === undefined ? "—" : (d.protectionHealthy ? "Healthy" : "Needs setup");
    el.innerHTML =
      '<div class="dev-strip ' + (online ? "on" : "off") + '"></div>'
      + '<div class="dev-top" style="display:flex;justify-content:flex-end">'
      + '<span class="pill ' + (online ? "on" : "off") + '"><span class="dot"></span>' + (online ? "online" : "offline") + '</span></div>'
      + '<div class="name"></div>'
      + '<div class="meta"></div>'
      + '<div class="tiles">'
      + '<div class="tile"><span>Mode</span><b>' + escapeHtml(d.enforcementMode || "—") + '</b></div>'
      + '<div class="tile"><span>Health</span><b>' + escapeHtml(health) + '</b></div>'
      + '<div class="tile"><span>Platform</span><b>' + escapeHtml(d.platform || "—") + '</b></div>'
      + '</div>'
      + '<div class="dev-foot"><span class="seen muted small"></span><span class="spacer"></span>'
      + '<button class="ghost danger mini" onclick="event.stopPropagation(); removeDevice(\'' + escapeAttr(d.deviceId) + '\')">Remove</button></div>';
    el.querySelector(".name").textContent = d.label || d.deviceId;
    el.querySelector(".meta").textContent = d.deviceId || "";
    el.querySelector(".seen").textContent = d.lastSeen ? ("Last seen " + new Date(d.lastSeen).toLocaleString()) : "Never seen";
    el.onclick = () => loadDevice(d.deviceId);
    grid.appendChild(el);
  });
}
async function loadDevices(){
  const raw = await dbGet("users/" + auth.uid + "/devices");
  const obj = (raw && raw.trim() !== "null") ? JSON.parse(raw) : {};
  DEVICES = Object.entries(obj).map(([deviceId, v]) => ({
    deviceId,
    label: (v && str(v.label)) || deviceId,
    online: !!(v && v.online === true),
    lastSeen: v ? num(v.lastSeen) || 0 : 0,
    platform: v ? str(v.platform) : null,
    enforcementMode: v ? str(v.enforcementMode) : null,
    protectionHealthy: v ? (v.protectionHealthy === undefined ? undefined : !!v.protectionHealthy) : undefined,
  })).sort((a, b) => String(a.label).localeCompare(b.label, undefined, { sensitivity: "base" }));
}
function showDeviceList(){
  SCOPE = { kind: "device", deviceId: null };
  stopAllDeviceStreams();
  pendingRevision = null;
  setHeader("Parent console");
  $("btnBack").classList.add("hidden");
  $("btnDiag").classList.add("hidden");
  $("btnSignOut").classList.remove("hidden");
  show("deviceList");
  renderDeviceList();
}
const signIn = withBusy(async () => {
  $("loginErr").textContent = "";
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password){ $("loginErr").textContent = "Email and password required."; return; }
  show("loading"); $("loadMsg").textContent = "Signing in…";
  try {
    await auth.signIn(email, password);
    refreshServerOffset(); // fire-and-forget: never block sign-in on the offset call
    await loadDevices();
    showDeviceList();
  } catch (e){
    show("landing");
    $("loginErr").textContent = e.message || "Sign-in failed.";
  }
});
const signOut = withBusy(async () => {
  const yes = await askConfirm("Sign out?", "You will need to sign in again to control your devices.", "Sign out");
  if (!yes) return;
  auth.signOut();
  goHome();
});
async function tryRestoreSession(){
  if (!auth.refreshToken) return false;
  try {
    await auth.ensure();
    refreshServerOffset(); // fire-and-forget
    await loadDevices();
    showDeviceList();
    return true;
  } catch (e){ return false; }
}
const loadDevice = withBusy(async (id) => {
  SCOPE = { kind: "device", deviceId: id };
  pendingRevision = null;
  setHeader("Loading device…");
  $("btnBack").classList.remove("hidden");
  $("btnDiag").classList.remove("hidden");
  show("loading"); $("loadMsg").textContent = "Loading device…";
  startDeviceStreams(id);
  try {
    const st = await composeDeviceState(id);
    STATE = st;
    render();
    show("app");
    setHeader("Controlling: " + (st.label || id) + (st.online ? " · online" : " · offline"));
  } catch (e){
    showDeviceList();
    toast("Failed: " + (e.message || "unknown"));
  }
});

// ----------------------------------------------------------- actions (owner)
// App-rule patches MUST carry packageKey (== the encoded key) — the Firebase rules
// require hasChildren(['packageKey','packageName','manualBlocked']). Omitting it
// makes the whole control write fail with "Permission denied".
function appRuleFor(key, pkg, blocked, limit){
  const r = { packageKey: key, packageName: pkg, manualBlocked: blocked };
  if (limit !== undefined && limit !== null) r.dailyLimitMinutes = limit;
  return r;
}
function appRule(key, blocked, limit){ return appRuleFor(key, pkgOf(key), blocked, limit); }

const savePatch = withBusy(async (patch) => {
  const w = await writeControl(SCOPE.deviceId, patch);
  if (w.ok){ noteWritten(w.revisionId); }
  else { toast("Error: " + (w.error || "failed")); }
  maybeRender();
});
function curApp(key){ return (STATE.apps || []).find(x => x.key === key) || null; }
function curBlocked(key){ const a = curApp(key); return a ? !!a.blocked : false; }
function curLimit(key){ const a = curApp(key); return a && a.dailyLimitMinutes ? a.dailyLimitMinutes : ""; }
function pkgOf(key){ const a = curApp(key); return a && a.packageName ? a.packageName : key; }
const toggleBlock = withBusy(async (key) => { await savePatch({ apps: { [key]: appRule(key, !curBlocked(key)) } }); });
const saveLimit = withBusy(async (key) => {
  const el = $("lim_" + key); if (!el) return;
  const v = el.value.trim();
  if (v !== "" && Number.isNaN(parseInt(v, 10))){ toast("Enter a number of minutes (1-1440)."); return; }
  const lim = v === "" ? null : Math.max(1, Math.min(1440, parseInt(v, 10)));
  await savePatch({ apps: { [key]: appRule(key, curBlocked(key), lim) } });
});
const addAppByName = withBusy(async () => {
  const name = $("addName").value.trim();
  if (!name) return;
  const key = b64urlEncode(name);
  await savePatch({ apps: { [key]: appRuleFor(key, name, false) } });
});
const activateMode = withBusy(async (id) => {
  const m = (STATE.modes || []).find(x => x.modeId === id);
  const yes = await askConfirm("Activate mode?", (m ? '"' + m.name + '"' : "This mode") + " will override the app rules: apps listed in the mode follow the mode rules, unlisted apps are allowed.", "Activate");
  if (!yes) return;
  await savePatch({ activeMode: { modeId: id, modeName: m ? m.name : null } });
});
const deactivateMode = withBusy(async () => {
  const yes = await askConfirm("Deactivate mode?", "The device goes back to its normal (top-level) app rules.", "Deactivate");
  if (!yes) return;
  await savePatch({ activeMode: null });
});
const renameMode = withBusy(async (id) => {
  const m = (STATE.modes || []).find(x => x.modeId === id);
  const name = await askText("Rename mode", "Mode name", m ? m.name : "", v => { if (!v.trim()){ $("mErr").textContent = "Name required."; return false; } return true; });
  if (!name) return;
  await savePatch({ modes: { [id]: { modeId: id, name: name.trim() } } });
});
const deleteMode = withBusy(async (id) => {
  const m = (STATE.modes || []).find(x => x.modeId === id);
  const isActive = m && STATE.activeModeId === id;
  const yes = await askConfirm("Delete mode" + (m ? ' "' + m.name + '"' : "") + "?", "This removes the mode and all of its app rules." + (isActive ? " It is currently ACTIVE — the device returns to the top-level rules." : ""), "Delete", true);
  if (!yes) return;
  if (isActive) await savePatch({ modes: { [id]: null }, activeMode: null });
  else await savePatch({ modes: { [id]: null } });

const createMode = withBusy(async () => {

  if (!name) return;

  await savePatch({ modes: { [id]: { modeId: id, name: name.trim(), apps: {} } } });

const setSafe = withBusy(async (on) => {
  if (on){ pauseSafe(); return; }
  await savePatch({ safeMode: { enabled: false, until: 0 } });
});
const pauseSafe = withBusy(async () => {
  const custom = $("safeCustom") ? parseInt($("safeCustom").value, 10) : 0;
  const dur = (!Number.isNaN(custom) && custom > 0) ? Math.min(1440, custom) * 60000 : (parseInt($("safeDur").value, 10) || 3600000);
  const yes = await askConfirm("Pause the device?", "All app locks will be paused for " + fmtMs(dur) + ".", "Pause");
  if (!yes) return;
  await savePatch({ safeMode: { enabled: true, until: serverNow() + dur } });
});
const saveBudget = withBusy(async () => {
  const v = $("budget").value.trim();
  if (v !== "" && Number.isNaN(parseInt(v, 10))){ toast("Enter a number of minutes (1-1440)."); return; }
  const lim = v === "" ? null : Math.max(1, Math.min(1440, parseInt(v, 10)));
  await savePatch({ budget: lim == null ? null : { dailyLimitMinutes: lim } });
});
const toggleAllowlist = withBusy(async () => {
  const on = !STATE.allowlistEnabled;
  const yes = await askConfirm((on ? "Enable" : "Disable") + " allowlist mode?", on ? "Every app without an explicit rule will be BLOCKED until you allow it." : "Apps without rules return to their normal (unblocked) state.", on ? "Enable" : "Disable", on);
  if (!yes) return;
  await savePatch({ allowlist: { enabled: on } });
});
const saveSchedule = withBusy(async () => {
  const enabled = $("schEnabled").checked;
  if (!enabled){ await savePatch({ schedule: null }); return; }
  const start = Math.max(0, Math.min(1439, parseInt($("schStart").value || "0", 10) || 0));

  await savePatch({ schedule: { enabled: true, startMinute: start, endMinute: end } });
});
const disableSchedule = withBusy(async () => { await savePatch({ schedule: null }); });
const toggleContentFilter = withBusy(async (cat) => {
  const cf = Object.assign({ social: false, gambling: false, adult: false, gaming: false }, STATE.contentFilter || {});
  cf[cat] = !cf[cat];
  await savePatch({ contentFilter: cf });
});
const savePin = withBusy(async () => {

  if (!/^\d{6}$/.test(pin)){ toast("PIN must be exactly 6 digits."); return; }

  toast(w.ok ? "PIN sent" : ("PIN failed: " + (w.error || "")));

});
const addDomain = withBusy(async () => {
  const v = $("newDomain").value.trim();
  if (!v) return;
  const cur = (STATE.customDomains || []).slice();
  if (!cur.includes(v)) cur.push(v);
  await savePatch({ customBlockedDomains: cur });

const removeDomain = withBusy(async (d) => {

  await savePatch({ customBlockedDomains: cur });
});
async function devicePost(action, body, label){
  try {
    if (action === "command") await sendCommand(SCOPE.deviceId, body.type, body.packageName || null);
    else if (action === "unlock-respond") await respondUnlock(SCOPE.deviceId, body.requestId, body.action);
    toast((label || action) + " sent");
  } catch (e){
    toast((label || action) + " failed: " + (e.message || ""));
  }
}
const rescanApps = withBusy(async () => { await devicePost("command", { type: "rescanApps" }, "Rescan"); });
const resetToday = withBusy(async (key) => {
  const label = (curApp(key) || {}).label || "this app";
  const yes = await askConfirm("Reset today?", "Clears today's usage for " + label + " so its daily limit restarts.", "Reset");
  if (!yes) return;
  await devicePost("command", { type: "resetToday", packageName: pkgOf(key) }, "Reset");
});
const respondUnlockUI = withBusy(async (requestId, action) => { await devicePost("unlock-respond", { requestId, action }, "Unlock"); });
const removeDevice = withBusy(async (id) => {
  const dev = DEVICES.find(d => d.deviceId === id);
  const yes = await askConfirm("Remove " + (dev && dev.label ? dev.label : "device") + "?", "This sends an unpair command to the device; it will need to be paired again to come back.", "Remove", true);
  if (!yes) return;
  try {
    await sendCommand(id, "unpair");
    toast("Unpair sent");
    DEVICES = DEVICES.filter(x => x.deviceId !== id);
    if (SCOPE && SCOPE.deviceId === id){ SCOPE.deviceId = null; }
    renderDeviceList();
  } catch (e){
    toast("Failed: " + (e.message || ""));
  }
});

// ----------------------------------------------------------- mode editor
function toggleModeEditor(modeId){
  window.__modeOpen = window.__modeOpen === modeId ? "" : modeId;
  render();
}
function setModeApp(modeId, key, blocked, limitOrNull){
  const rule = appRuleFor(key, pkgOf(key), blocked, undefined);
  if (limitOrNull === null) rule.dailyLimitMinutes = null; // JSON null deletes the field
  else if (limitOrNull != null) rule.dailyLimitMinutes = limitOrNull;
  savePatch({ modes: { [modeId]: { modeId, apps: { [key]: rule } } } });
}
function toggleModeBlock(modeId, key){
  const m = (STATE.modes || []).find(x => x.modeId === modeId);
  const row = m && (m.apps || []).find(x => x.key === key);
  setModeApp(modeId, key, row ? !row.blocked : true, undefined);
}
const saveModeLimit = withBusy(async (modeId, key) => {
  const el = $("mlim_" + key); if (!el) return;
  const m = (STATE.modes || []).find(x => x.modeId === modeId);
  const row = m && (m.apps || []).find(x => x.key === key);
  const blocked = row ? !!row.blocked : false;
  const v = el.value.trim();
  if (v === ""){ toast("Enter a number of minutes (1-1440), or use Clear."); return; }
  const n = parseInt(v, 10);
  if (Number.isNaN(n)){ toast("Enter a number of minutes (1-1440)."); return; }
  setModeApp(modeId, key, blocked, Math.max(1, Math.min(1440, n)));
});
const clearModeLimit = withBusy(async (modeId, key) => {
  const m = (STATE.modes || []).find(x => x.modeId === modeId);
  const row = m && (m.apps || []).find(x => x.key === key);
  setModeApp(modeId, key, row ? !!row.blocked : false, null);
});
const addModeApp = withBusy(async (modeId) => {
  const sel = $("madd_" + modeId);
  if (!sel || !sel.value) return;
  setModeApp(modeId, sel.value, false, undefined);
});
const removeModeApp = withBusy(async (modeId, key) => { savePatch({ modes: { [modeId]: { modeId, apps: { [key]: null } } } }); });
function appFilter(){
  const q = ($("appSearch").value || "").toLowerCase();
  document.querySelectorAll("#appTable tbody tr").forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
  });
