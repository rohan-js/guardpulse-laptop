// ----------------------------------------------------------- render
function renderModeEditor(m, appsInMode, dis){
  const usageMap = {};
  (STATE.usage || []).forEach(u => { usageMap[u.key] = u; });
  let html = '<div class="modebody"><div class="table-wrap"><table><thead><tr><th>App</th><th>Mode status</th><th>Mode limit (min)</th><th>Used today</th><th></th></tr></thead><tbody>';
  if (!appsInMode.length) html += '<tr><td colspan="5" class="muted">No app rules in this mode — unlisted apps are allowed while it is active.</td></tr>';
  appsInMode.forEach(a => {
    const u = usageMap[a.key];
    const used = u ? fmtMs(u.ms || u.minutes * 60000) : "0s";
    const over = u && u.lockBlocked;
    html += '<tr>'
      + '<td><div class="app-cell"><span class="app-tile">' + escapeHtml(String(a.label || a.packageName || a.key).charAt(0).toUpperCase()) + '</span><span>' + escapeHtml(a.label || a.packageName || a.key) + '</span></div></td>'
      + '<td><span class="pill ' + (a.blocked ? "bad" : "on") + '"><span class="dot"></span>' + (a.blocked ? "Locked" : "Allowed") + '</span></td>'
      + '<td><span class="cell-row"><input id="mlim_' + a.key + '" type="number" min="1" max="1440" value="' + (a.dailyLimitMinutes || "") + '" style="width:80px" aria-label="Mode daily limit" /> '
      + '<button class="mini"' + dis + ' onclick="saveModeLimit(\'' + escapeAttr(m.modeId) + '\',\'' + a.key + '\')">Set</button>'
      + (a.dailyLimitMinutes ? ' <button class="mini ghost"' + dis + ' onclick="clearModeLimit(\'' + escapeAttr(m.modeId) + '\',\'' + a.key + '\')">Clear</button>' : '') + '</span></td>'
      + '<td><span class="chip' + (over ? " bad" : "") + '">' + escapeHtml(used) + '</span> <span class="muted small">(app total)</span></td>'
      + '<td class="right"><div class="row">'
      + '<label class="switch"><input type="checkbox" ' + (a.blocked ? "" : "checked") + dis + ' onchange="toggleModeBlock(\'' + escapeAttr(m.modeId) + '\',\'' + a.key + '\')" aria-label="Allow app in mode" />'
      + '<span class="track"><span class="knob"></span></span></label> '
      + '<button class="mini ghost danger"' + dis + ' onclick="removeModeApp(\'' + escapeAttr(m.modeId) + '\',\'' + a.key + '\')">Remove</button></div></td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';
  const existing = new Set(appsInMode.map(x => x.key));
  const candidates = (STATE.apps || []).filter(a => !existing.has(a.key));
  if (candidates.length){
    html += '<div class="row" style="margin-top:10px"><select id="madd_' + escapeAttr(m.modeId) + '" aria-label="App to add to mode">';
    candidates.forEach(a => { html += '<option value="' + escapeAttr(a.key) + '">' + escapeHtml(a.label || a.packageName) + '</option>'; });
    html += '</select><button class="mini"' + dis + ' onclick="addModeApp(\'' + escapeAttr(m.modeId) + '\')">Add app to mode</button></div>';
  }
  html += '</div>';
  return html;
}
function render(){
  if (!STATE || !SCOPE) return;
  const app = $("app");
  const s = STATE;
  const usageMap = {};
  (s.usage || []).forEach(u => { usageMap[u.key] = u; });
  const gate = pendingStatus() === "waiting";
  const dis = gate ? " disabled" : "";
  let html = "";
  lastRenderKey = stateKey();

  if (pendingRevision === "__timeout__"){
    html += '<div class="banner delayed">' + icon("warning", 18) + '<span>Device connection delayed — your change was sent but the device has not confirmed it yet. It will apply when the device is back online.</span></div>';
  } else if (gate){
    html += '<div class="banner"><span class="spin">' + icon("sync", 18) + '</span><span>Waiting for the device to confirm your change…</span></div>';
  }

  html += '<div class="console-grid">';
  html += '<section class="cg-rail">';

  const health = s.protectionHealthy === true ? "Healthy" : (s.protectionHealthy === false ? "Needs setup" : "—");
  const healthPill = s.protectionHealthy === true ? '<span class="pill on"><span class="dot"></span>Healthy</span>'
    : (s.protectionHealthy === false ? '<span class="pill warn"><span class="dot"></span>Needs setup</span>' : '—');
  let statusRows =
    '<div class="status-row"><span class="label">Connection</span><span class="value">'
    + '<span class="pill ' + (s.online ? "on" : "off") + '"><span class="dot"></span>' + (s.online ? "online" : "offline") + '</span></span></div>'
    + '<div class="status-row"><span class="label">Enforcement</span><span class="value mono">' + escapeHtml(s.enforcementMode || "—") + '</span></div>'
    + '<div class="status-row"><span class="label">Protection</span><span class="value">' + healthPill + '</span></div>'
    + '<div class="status-row"><span class="label">Last seen</span><span class="value">' + (s.lastSeen ? new Date(s.lastSeen).toLocaleString() : "—") + '</span></div>';
  if (s.syncStatus){
    const syncPill = s.syncStatus === "applied" ? '<span class="pill on"><span class="dot"></span>Synced</span>'
      : (s.syncStatus === "failed" ? '<span class="pill bad"><span class="dot"></span>Failed</span>'
      : '<span class="pill warn"><span class="dot"></span>Pending</span>');
    statusRows += '<div class="status-row"><span class="label">Sync</span><span class="value">' + syncPill
      + (s.syncAppliedAt ? ' <span class="muted small">' + new Date(s.syncAppliedAt).toLocaleTimeString() + '</span>' : '') + '</span></div>';
  }
  html += '<div class="card"><div class="card-head">' + icon("devices", 18) + '<h2>Device status</h2></div><div class="card-body" style="padding:8px 20px">' + statusRows + '</div></div>';

  // Browser now (devices/{id}/state/browser) — hidden entirely when the agent hasn't reported one.
  const brw = (s.browser && typeof s.browser === "object") ? s.browser : null;
  if (brw){
    const stale = !num(brw.updatedAt) || (serverNow() - num(brw.updatedAt)) > 300000;
    const tabs = Array.isArray(brw.tabs) ? brw.tabs : [];
    const tabN = num(brw.tabCount) != null ? num(brw.tabCount) : tabs.length;
    const topSites = Object.entries(brw.domainsToday && typeof brw.domainsToday === "object" ? brw.domainsToday : {})
      .map(([d, ms]) => ({ d, ms: num(ms) || 0 }))
      .sort((x, y) => y.ms - x.ms)
      .slice(0, 8);
    html += '<div class="card"><div class="card-head">' + icon("globe", 18) + '<h2>Browser now</h2><span class="count">' + tabN + '</span>'
      + (stale ? '<span class="pill warn"><span class="dot"></span>stale</span>' : '<span class="pill on"><span class="dot"></span>live</span>')
      + '</div><div class="card-body' + (stale ? " muted" : "") + '" style="padding:8px 20px">';
    html += '<div class="status-row"><span class="label">Browser</span><span class="value">' + escapeHtml(brw.label || brw.browser || "—") + '</span></div>'
      + '<div class="status-row"><span class="label">On</span><span class="value">' + escapeHtml(brw.activeTab || "—") + '</span></div>'
      + (brw.activeUrl ? '<div class="status-row"><span class="label">URL</span><span class="value mono">' + escapeHtml(brw.activeUrl) + '</span></div>' : '')
      + '<div class="status-row"><span class="label">Tabs open</span><span class="value">' + tabN + '</span></div>';
    if (topSites.length){
      html += '<div class="small muted" style="margin:10px 0 2px">Today by site</div>';
      topSites.forEach(t => {
        html += '<div class="status-row"><span class="value">' + escapeHtml(b64urlDecode(t.d)) + '</span><span class="chip">' + escapeHtml(fmtMs(t.ms)) + '</span></div>';
      });
    }
    if (tabs.length){
      html += '<details class="tablist"><summary>' + tabN + ' tabs open</summary>';
      tabs.forEach(t => {
        if (!t || typeof t !== "object") return;
        html += '<div class="tab">'
          + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(t.title || "(untitled)")
          + (t.title === brw.activeTab ? ' <span class="chip">active</span>' : '') + '</span>'
          + (t.url ? '<span class="mono muted small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(t.url) + '</span>' : '')
          + '</div>';
      });
      html += '</details>';
    }
    html += '</div></div>';
  }

  const pend = (s.pendingUnlocks || []);
  if (pend.length){
    html += '<div class="card"><div class="card-head">' + icon("apps", 18) + '<h2>Pending requests</h2><span class="count">' + pend.length + '</span></div><div class="card-body">';
    pend.forEach(r => {
      const critical = r.expiresAt && (r.expiresAt - serverNow()) < 120000;
      const initial = String(r.label || r.packageName || "?").charAt(0).toUpperCase();
      html += '<div class="reqrow' + (critical ? " critical" : "") + '">'
        + '<div class="req-top"><span class="app-tile">' + escapeHtml(initial) + '</span>'
        + '<div><div class="req-title">' + escapeHtml(r.label || r.packageName || r.requestId) + '</div>'
        + '<div class="muted small">' + escapeHtml(r.reason || "") + ' · requested ' + escapeHtml(fmtAge(r.createdAt))
        + (r.expiresAt ? ' · expires in ' + escapeHtml(fmtMs(Math.max(0, r.expiresAt - serverNow()))) : '') + '</div></div></div>'
        + '<div class="req-actions">'
        + '<button class="mini"' + dis + ' onclick="respondUnlockUI(\'' + escapeAttr(r.requestId) + '\',\'approveOneVisit\')">One visit</button>'
        + '<button class="mini"' + dis + ' onclick="respondUnlockUI(\'' + escapeAttr(r.requestId) + '\',\'approve15\')">15 min</button>'
        + '<button class="mini"' + dis + ' onclick="respondUnlockUI(\'' + escapeAttr(r.requestId) + '\',\'approve30\')">30 min</button>'
        + '<button class="ghost danger mini"' + dis + ' onclick="respondUnlockUI(\'' + escapeAttr(r.requestId) + '\',\'deny\')">Deny</button>'
        + '</div></div>';
    });
    html += '</div></div>';
  }
  html += '</section>';

  // Apps
  html += '<section class="cg-apps"><div class="card table-card">';
  html += '<div class="card-head">' + icon("apps", 18) + '<h2>Apps</h2><span class="count">' + (s.apps || []).length + '</span><span class="spacer"></span>'
    + '<button class="mini"' + dis + ' onclick="rescanApps()">' + icon("sync", 14) + ' Rescan apps</button></div>';
  html += '<div class="card-tools"><div class="search-wrap">' + icon("search", 16)
    + '<input id="appSearch" placeholder="Search apps…" oninput="appFilter()" aria-label="Search apps" /></div></div>';
  html += '<div class="table-wrap"><table id="appTable"><thead><tr><th>App</th><th>Status</th><th>Daily limit (min)</th><th>Today</th><th class="right">Actions</th></tr></thead><tbody>';
  const apps = (s.apps || []);
  if (!apps.length) html += '<tr><td colspan="5" class="muted">No apps configured.</td></tr>';
  apps.forEach(a => {
    const u = usageMap[a.key];
    const mins = u ? u.minutes : 0;
    const limitHit = !!(u && u.lockBlocked);
    // Phone parity: when the TV has reported runtime state for this app, show what it
    // is ACTUALLY enforcing (lockBlocked); only fall back to the desired rule when the
    // TV hasn't reported state yet (e.g. app never ran). The switch below still edits
    // the desired rule (manualBlocked), like the phone's switch.
    const effectiveLocked = u !== undefined ? !!u.lockBlocked : !!a.blocked;
    const isProtected = !!a.protectedReason && !effectiveLocked;
    const status = effectiveLocked
      ? '<span class="pill bad"><span class="dot"></span>' + (a.blocked ? "Locked by parent" : "Locked") + '</span>'
      : (isProtected ? '<span class="pill" title="' + escapeAttr(a.protectedReason) + '">Protected</span>'
      : '<span class="pill on"><span class="dot"></span>Allowed</span>');
    const initial = String(a.label || a.packageName || a.key).charAt(0).toUpperCase();
    html += '<tr' + ((effectiveLocked || limitHit) ? ' class="rowbad"' : '') + '>'
      + '<td><div class="app-cell"><span class="app-tile">' + escapeHtml(initial) + '</span><span>' + escapeHtml(a.label || a.packageName || a.key) + '</span></div></td>'
      + '<td>' + status + '</td>'
      + '<td><span class="cell-row"><input id="lim_' + a.key + '" type="number" min="1" max="1440" value="' + curLimit(a.key) + '" style="width:64px" aria-label="Daily limit minutes" /> '
      + '<button class="mini"' + dis + ' onclick="saveLimit(\'' + a.key + '\')">Set</button></span></td>'
      + '<td>' + (mins ? '<span class="chip' + (limitHit ? " bad" : "") + '">' + escapeHtml(fmtMs((u.ms || mins * 60000))) + '</span>' : '—') + '</td>'
      + '<td class="right"><div class="row">'
      + '<label class="switch" title="' + (isProtected ? escapeAttr(a.protectedReason || "Protected") : (a.blocked ? "Allow this app" : "Lock this app")) + '">'
      + '<input type="checkbox" ' + (a.blocked ? "" : "checked") + dis + (isProtected ? " disabled" : "") + ' onchange="toggleBlock(\'' + a.key + '\')" aria-label="Allow app" />'
      + '<span class="track"><span class="knob"></span></span></label>'
      + '<button class="mini ghost"' + dis + ' onclick="resetToday(\'' + a.key + '\')">Reset</button>'
      + '</div></td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="card-body" style="padding-top:14px">'
    + '<div class="row"><input id="addName" placeholder="package name (e.g. com.example.app)" style="width:280px" />'
    + '<button' + dis + ' onclick="addAppByName()">Add app</button></div>'
    + '<p class="muted small" style="margin:10px 0 0">Unlocking works like the phone: when the child taps "Ask parent" on a locked app, the request appears in <b>Pending requests</b> for you to approve (one visit / 15 / 30 min) or deny.</p>'
    + '</div></div></section>';

  // Modes
  const modes = (s.modes || []);
  const anyEditorOpen = modes.some(m => (window.__modeOpen || "") === m.modeId);
  html += '<section class="cg-modes' + (anyEditorOpen ? " span-full" : "") + '"><div class="card">';
  html += '<div class="card-head">' + icon("tune", 18) + '<h2>Modes</h2><span class="count">' + modes.length + '</span></div>';
  html += '<div class="card-body">';
  html += '<p class="muted small" style="margin-top:0">When a mode is active, listed apps use the mode rules and unlisted apps are allowed.</p>';
  const activeId = s.activeModeId || null;
  if (!modes.length) html += '<p class="muted small">No modes yet.</p>';
  html += '<div class="modes-list">';
  modes.forEach(m => {
    const appsInMode = (m.apps || []);
    const lockedN = appsInMode.filter(x => x.blocked).length;
    const limitN = appsInMode.filter(x => x.dailyLimitMinutes).length;
    const isActive = m.modeId === activeId;
    const open = (window.__modeOpen || "") === m.modeId;
    html += '<div class="modebox' + (isActive ? " active" : "") + '">'
      + '<div class="modehead">'
      + '<b>' + escapeHtml(m.name) + '</b>'
      + (isActive ? '<span class="pill on"><span class="dot"></span>Active</span>' : '')
      + '<span class="muted small">' + lockedN + ' locked · ' + limitN + ' limits</span>'
      + '<span class="spacer"></span>'
      + (isActive
          ? '<button class="mini"' + dis + ' onclick="deactivateMode()">Deactivate</button>'
          : '<button class="mini primary"' + dis + ' onclick="activateMode(\'' + m.modeId + '\')">Activate</button>')
      + '<button class="mini ghost" onclick="toggleModeEditor(\'' + escapeAttr(m.modeId) + '\')">' + (open ? "Close" : "Edit rules") + '</button>'
      + '<button class="mini ghost"' + dis + ' onclick="renameMode(\'' + m.modeId + '\')">Rename</button>'
      + '<button class="mini ghost danger"' + dis + ' onclick="deleteMode(\'' + m.modeId + '\')">Delete</button>'
      + '</div>'
      + (open ? renderModeEditor(m, appsInMode, dis) : '')
      + '</div>';
  });
  html += '</div>';
  html += '<button' + dis + ' onclick="createMode()">' + icon("plus", 14) + ' New mode</button>';
  html += '</div></div></section>';

  // Device rules
  html += '<section class="cg-rules"><div class="card">';
  html += '<div class="card-head">' + icon("tune", 18) + '<h2>Device rules</h2></div>';
  html += '<div class="rules-grid">';

  const sm = s.safeMode || { enabled: false };
  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("pause", 15) + 'Safe Mode (pause)</h3>';
  if (sm.enabled){
    html += '<p class="ok small" style="margin:0 0 10px">All app locks are paused until <b>' + new Date(sm.until).toLocaleTimeString() + '</b> (' + escapeHtml(fmtRemaining(sm.until)) + ').</p>'
      + '<button class="danger"' + dis + ' onclick="setSafe(false)">Resume now</button>';
  } else {
    html += '<div class="row"><select id="safeDur" aria-label="Pause duration">'
      + '<option value="900000">15 minutes</option><option value="1800000">30 minutes</option>'
      + '<option value="3600000">1 hour</option><option value="7200000">2 hours</option></select>'
      + '<input id="safeCustom" type="number" min="1" max="1440" placeholder="or custom min" style="width:110px" aria-label="Custom minutes" />'
      + '<button class="primary"' + dis + ' onclick="pauseSafe()">Pause</button></div>';
  }
  html += '</div>';

  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("clock", 15) + 'Daily limit (this device)</h3>'
    + '<div class="row"><input id="budget" type="number" min="1" max="1440" value="' + (s.budgetMinutes || "") + '" style="width:100px" aria-label="Device daily limit minutes" />'
    + '<button' + dis + ' onclick="saveBudget()">Save</button>'
    + (s.budgetMinutes ? ' <span class="muted small">current: ' + s.budgetMinutes + ' min/day</span>' : '')
    + '</div></div>';

  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("check", 15) + 'Allowlist mode</h3>'
    + '<label class="switch"><input type="checkbox" ' + (s.allowlistEnabled ? "checked" : "") + ' onchange="toggleAllowlist()" aria-label="Allowlist mode" />'
    + '<span class="track"><span class="knob"></span></span>'
    + '<span class="small">' + (s.allowlistEnabled ? '<b class="err">On</b> — only apps with an explicit rule are permitted' : 'Off — only allowed apps are permitted when on') + '</span></label>'
    + '</div>';

  const sch = s.schedule || {};
  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("clock", 15) + 'Allowed hours (schedule)</h3>'
    + '<div class="row">'
    + '<label class="switch"><input id="schEnabled" type="checkbox" ' + (sch.enabled ? "checked" : "") + ' />'
    + '<span class="track"><span class="knob"></span></span><span class="small">Enabled</span></label>'
    + '<input id="schStart" type="number" min="0" max="1439" value="' + (sch.startMinute != null ? sch.startMinute : '') + '" style="width:76px" title="start minute (0-1439)" aria-label="Start minute" /> – '
    + '<input id="schEnd" type="number" min="0" max="1439" value="' + (sch.endMinute != null ? sch.endMinute : '') + '" style="width:76px" title="end minute (0-1439)" aria-label="End minute" />'
    + '<button' + dis + ' onclick="saveSchedule()">Save</button>'
    + (sch.enabled ? ' <button class="ghost"' + dis + ' onclick="disableSchedule()">Disable</button>' : '')
    + '</div>'
    + '<p class="muted small" style="margin:8px 0 0">Minutes from local midnight; an end before start wraps past midnight.</p></div>';

  const cf = s.contentFilter || {};
  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("globe", 15) + 'Content filter (websites)</h3>'
    + '<div class="row" style="gap:16px">'
    + '<label class="small"><input id="cf_social" type="checkbox" ' + (cf.social ? "checked" : "") + ' onchange="toggleContentFilter(\'social\')" /> Social</label>'
    + '<label class="small"><input id="cf_gambling" type="checkbox" ' + (cf.gambling ? "checked" : "") + ' onchange="toggleContentFilter(\'gambling\')" /> Gambling</label>'
    + '<label class="small"><input id="cf_adult" type="checkbox" ' + (cf.adult ? "checked" : "") + ' onchange="toggleContentFilter(\'adult\')" /> Adult</label>'
    + '<label class="small"><input id="cf_gaming" type="checkbox" ' + (cf.gaming ? "checked" : "") + ' onchange="toggleContentFilter(\'gaming\')" /> Gaming</label>'
    + '</div>'
    + '<p class="muted small" style="margin:8px 0 0">Blocks the chosen categories via the hosts file.</p></div>';

  html += '<div class="rule-sec"><h3 class="sec-title">' + icon("check", 15) + 'Device PIN</h3>'
    + '<div class="row"><input id="devPin" type="password" maxlength="6" placeholder="new 6-digit PIN" style="width:150px;font-family:var(--mono);letter-spacing:.2em" aria-label="New PIN" />'
    + '<button class="primary"' + dis + ' onclick="savePin()">' + (s.pinConfigured ? "Change PIN" : "Set PIN") + '</button></div>'
    + '<p class="muted small" style="margin:8px 0 0">Sets the PIN this device uses for quick control unlocks.</p></div>';

  html += '<div class="rule-sec span2"><h3 class="sec-title">' + icon("globe", 15) + 'Blocked websites</h3>';
  const domains = (s.customDomains || []);
  if (domains.length){
    html += '<div class="row" style="margin-bottom:12px">';
    domains.forEach(d => { html += '<span class="chip">' + escapeHtml(d) + ' <a class="link" onclick="removeDomain(\'' + escapeAttr(d) + '\')" aria-label="Remove ' + escapeAttr(d) + '">✕</a></span> '; });
    html += '</div>';
  } else html += '<p class="muted small" style="margin:0 0 12px">None.</p>';
  html += '<div class="row"><input id="newDomain" placeholder="example.com or youtube.com/shorts" style="width:300px" aria-label="Domain to block" />'
    + '<button' + dis + ' onclick="addDomain()">Add</button></div>'
    + '<p class="muted small" style="margin:8px 0 0">Paths are supported, e.g. youtube.com/shorts.</p></div>';

  html += '</div></div></section>';

  const evts = (s.tamperEvents || []);
  if (evts.length){
    html += '<section class="cg-events"><div class="card">';
    html += '<div class="card-head">' + icon("apps", 18) + '<h2>Protection events</h2><span class="count">' + evts.length + '</span></div><div class="card-body">';
    evts.forEach(e => {
      const type = String(e.type || "event").toLowerCase();
      const critical = type.indexOf("disabled") >= 0 || type.indexOf("risky") >= 0 || type.indexOf("missing") >= 0;
      html += '<div class="reqrow' + (critical ? " critical" : "") + '">'
        + '<span class="pill' + (critical ? " bad" : "") + '">' + escapeHtml(e.type || "event") + '</span> '
        + '<span class="muted small">' + (e.createdAt ? new Date(e.createdAt).toLocaleString() : "") + '</span><br />'
        + escapeHtml(e.message || "") + '</div>';
    });
    html += '</div></div></section>';
  }

  html += '</div>';
  app.innerHTML = html;
}

// ------------------------------------------------------------------ boot
$("navDevIcon").innerHTML = icon("devices", 16);
$("navOutIcon").innerHTML = icon("logout", 16);
goHome();
tryRestoreSession().then(restored => {
  if (!restored){ show("landing"); }
});
setInterval(() => { refreshServerOffset(); }, 60 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && SCOPE && SCOPE.deviceId) refreshState(true);
});
</script>
</body>
</html>
