<style>
        .mica-bg {
            background-color: rgba(252, 248, 251, 0.75); /* surface with opacity */
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }
        
        .dark .mica-bg {
             background-color: rgba(48, 48, 50, 0.85); /* inverse-surface base */
        }
        
        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #0058bc; /* primary */
            background-color: transparent;
            transition: all 0.2s ease;
        }
        
        .pin-dot.filled {
            background-color: #0058bc;
        }
        
        .keypad-btn {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 500;
            color: #1b1b1d; /* on-surface */
            background: transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        
        .keypad-btn:hover {
            background-color: rgba(228, 226, 228, 0.5); /* surface-variant transparent */
        }
        
        .dark .keypad-btn {
            color: #f3f0f2; /* inverse-on-surface */
        }
        
        .dark .keypad-btn:hover {
            background-color: rgba(243, 240, 242, 0.1);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
      </style>
</head>
<body class="bg-surface-background dark:bg-on-background h-screen w-screen overflow-hidden font-body-md text-on-surface dark:text-inverse-on-surface antialiased">
<!-- Fullscreen Overlay Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A blurred, semi-transparent view of a modern web browser window showing a generic colorful website, acting as the locked application background behind a frosted glass layer. The style is clean, modern, and realistic, simulating a Windows 11 desktop environment. Light mode aesthetic with soft, bright colors bleeding through the blur." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC6YflJlZQAry2G8Y46zs13pj4o8PGoVH7vF_hI2aKYLLtuJGOq796ah1gceHQ8zO5AWiFAF5gEA9U3ld57bsCITjs2CczC8TlA8wQCTcSRNaBjT_VToCmEvwC8TR38PJheVv0Hm8j5zvWkiuw2AEfSuPyaRq-KeCS01gZpTe9wtlW_TzD8KcFHQcore7hj45ymHD5jtRqVrMnbrEMEAVkdQcIlcPVdZsxTKgwdkol6lxTUh7wfzYmX')"></div>

<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>

            </p>

<button class="keypad-btn" onclick="addPin()">1</button>
<button class="keypad-btn" onclick="addPin()">2</button>
<button class="keypad-btn" onclick="addPin()">3</button>
<button class="keypad-btn" onclick="addPin()">4</button>
<button class="keypad-btn" onclick="addPin()">5</button>
<button class="keypad-btn" onclick="addPin()">6</button>
<button class="keypad-btn" onclick="addPin()">7</button>
<button class="keypad-btn" onclick="addPin()">8</button>
<button class="keypad-btn" onclick="addPin()">9</button>
<button class="keypad-btn text-on-surface-variant" onclick="clearPin()">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<button class="keypad-btn" onclick="addPin()">0</button>
<button class="keypad-btn text-on-surface-variant" onclick="removePin()">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-outline mb-stack-lg text-center uppercase tracking-wider">
                Physical keyboard entry also works
            </p>
<!-- Secondary Action -->
<button class="px-6 py-2.5 border border-outline-variant rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-variant/50 transition-colors duration-200">
                Ask Parent to Unlock
            </button>
</div>
</div>
<script>
        let currentPin = 0;
        const maxPin = 6;
        const dots = document.querySelectorAll('.pin-dot');
        const container = document.getElementById('pin-container');
        const errorMsg = document.getElementById('error-message');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
            
            errorMsg.style.opacity = '0';
            container.classList.remove('shake');
        }

        function addPin() {
            if (currentPin < maxPin) {
                currentPin++;
                updateDots();
                
                if (currentPin === maxPin) {
                    // Simulate check
                    setTimeout(() => {
                        // Simulate wrong PIN for demonstration
                        container.classList.add('shake');
                        errorMsg.style.opacity = '1';
                        setTimeout(() => {
                            clearPin();
                        }, 1000);
                    }, 300);
                }
            }
        }

        function removePin() {
            if (currentPin > 0) {
                currentPin--;
                updateDots();
            }
        }
        
        function clearPin() {
            currentPin = 0;
            updateDots();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                addPin();
            } else if (e.key === 'Backspace') {
                removePin();
            } else if (e.key === 'Escape') {
                clearPin();
            }
        });
    </script>
